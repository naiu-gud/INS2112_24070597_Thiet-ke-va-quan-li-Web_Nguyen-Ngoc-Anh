  />

  <ellipse
    cx="625"
    cy="290"
    rx="62"
    ry="24"
    transform="rotate(-25 625 290)"
    fill="#4f8a68"
  />


  <!-- Laptop -->

  <rect
    x="230"
    y="145"
    width="340"
    height="220"
    rx="24"
    fill="#ffffff"
    stroke="#234f3f"
