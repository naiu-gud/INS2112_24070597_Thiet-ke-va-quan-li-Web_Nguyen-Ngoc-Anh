  width="800"
  height="520"
  viewBox="0 0 800 520"
>

  <rect
    width="800"
    height="520"
    rx="36"
    fill="#eef7f0"
  />

  <!-- Sun -->

  <circle
    cx="675"
    cy="95"
    r="48"
    fill="#f5d98b"
  />


  <!-- Ground -->

  <path
    d="M0 405
       C150 350, 280 445, 420 395
       C560 345, 675 430, 800 380
       L800 520
       L0 520 Z"
    fill="#dfeee3"
  />


  <!-- Left plant -->

  <path
