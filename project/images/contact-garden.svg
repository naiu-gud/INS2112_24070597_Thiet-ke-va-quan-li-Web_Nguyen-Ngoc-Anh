    fill="#75a985"
  />

  <ellipse
    cx="165"
    cy="280"
    rx="62"
    ry="24"
    transform="rotate(25 165 280)"
    fill="#4f8a68"
  />


  <!-- Right plant -->

  <path
    d="M685 420
       C675 340, 650 285, 625 230"
    fill="none"
    stroke="#234f3f"
    stroke-width="10"
    stroke-linecap="round"
  />

  <ellipse
    cx="675"
    cy="335"
    rx="65"
    ry="25"
    transform="rotate(30 675 335)"
