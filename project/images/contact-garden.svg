  />

  <rect
    x="185"
    y="365"
    width="430"
    height="25"
    rx="12"
    fill="#234f3f"
  />


  <!-- Message symbol -->

  <rect
    x="335"
    y="215"
    width="130"
    height="70"
    rx="18"
    fill="#75a985"
  />

  <path
    d="M365 285 L385 307 L400 285"
    fill="#75a985"
  />

  <circle
    cx="370"
    cy="250"
    r="7"
    fill="#ffffff"
